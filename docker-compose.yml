services:
  db:
    image: postgres:16-alpine
    container_name: staffmgmt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staffadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staffpass}
      POSTGRES_DB: ${POSTGRES_DB:-staffmgmt}
    ports:
      # Exposed so you can inspect the DB from a tool like DBeaver/pgAdmin if you want.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staffadmin} -d ${POSTGRES_DB:-staffmgmt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staffmgmt_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-staffadmin}:${POSTGRES_PASSWORD:-staffpass}@db:5432/${POSTGRES_DB:-staffmgmt}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-superadmin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
      # Where the backend looks for a built Flutter web bundle to serve at "/".
      WEB_DIR: /code/web
      # Where database backups (pg_dump) are written.
      BACKUP_DIR: /code/backups
    ports:
      - "8000:8000"
    # For local dev: live-reload when you edit code on the host.
    volumes:
      - ./backend/app:/code/app
      # Serve the built web UI same-origin from :8000 (run `flutter build web`
      # first). Read-only; if the folder is empty the backend just skips it.
      - ./staff_frontend/build/web:/code/web:ro
      # Database backups persist on the host (contain all data — keep private).
      - ./backups:/code/backups
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Cloudflare tunnel — publishes the app on your Cloudflare hostname without
  # opening any inbound ports. Only runs when you opt in with the "tunnel"
  # profile:  docker compose --profile tunnel up -d
  # Set TUNNEL_TOKEN in .env (Zero Trust > Networks > Tunnels > your tunnel >
  # Docker). In the dashboard, route your public hostname to http://backend:8000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: staffmgmt_cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - backend

volumes:
  pgdata:
